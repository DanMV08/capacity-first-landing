<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Transforma tu cuerpo en la máquina que es capaz de todo lo que le exiges. El método Capacity First.">
  <meta property="og:title" content="Capacity First | Transforma tu cuerpo">
  <meta property="og:description" content="Sin tener que usar más de 3 horas de tu semana.">
  <meta property="og:image" content="./assets/img/og-image.jpg">
  <meta property="og:type" content="website">
  <title>Capacity First | Transformación corporal sin tiempo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header" id="header">
    <div class="header__container">
      <div class="header__logo">CAPACITY FIRST</div>
      <button class="header__cta btn btn--gold" aria-label="Aplicar ahora a Capacity First">
        <span id="ctaText"></span>
      </button>
    </div>
  </header>

  <!-- HERO + VSL -->
  <section class="hero" id="hero">
    <div class="hero__content">
      <div class="hero__title-wrapper">
        <h1 class="hero__title">
          Transforma tu cuerpo en la <span class="gold-text">máquina</span> que es <span class="gold-text">capaz de todo</span> lo que le exiges.
        </h1>
      </div>
      <p class="hero__subtitle" id="heroSubtitle"></p>

      <!-- Video VSL -->
      <div class="hero__video-wrapper">
        <div class="hero__video-container" id="vturb-embed">
          <div class="video-placeholder">
            <div class="video-placeholder__text">VSL aquí</div>
          </div>
        </div>
      </div>

      <button class="btn btn--gold btn--large" id="ctaHero" aria-label="Aplicar ahora">
        <span id="ctaHeroText"></span>
      </button>
    </div>
  </section>

  <!-- ¿DE DÓNDE SALE EL MÉTODO? -->
  <section class="method-section" id="method">
    <div class="method-section__container">
      <div class="method-section__text">
        <span class="label" id="methodLabel"></span>
        <h2 class="method-section__title" id="methodTitle"></h2>
        <blockquote class="method-section__quote" id="methodQuote"></blockquote>
        <div class="method-section__divider"></div>
        <p class="method-section__attribution" id="methodAttribution"></p>
      </div>
      <div class="method-section__image" id="methodImage"></div>
    </div>
  </section>

  <!-- CASOS DE ÉXITO -->
  <section class="testimonials-section" id="testimonials">
    <div class="testimonials-section__container">
      <span class="label" id="testimonialsLabel"></span>
      <h2 class="testimonials-section__title" id="testimonialsTitle"></h2>

      <div class="testimonials-section__separator">
        <span id="testimonialsSubtitle"></span>
        <div class="separator-line"></div>
      </div>

      <div class="testimonials-grid" id="testimonialsGrid"></div>
    </div>
  </section>

  <!-- Modal para videos de testimonios -->
  <div class="modal" id="videoModal" aria-hidden="true">
    <div class="modal__overlay" id="modalOverlay"></div>
    <div class="modal__content">
      <button class="modal__close" id="modalClose" aria-label="Cerrar video">×</button>
      <div class="modal__video-wrapper" id="videoWrapper"></div>
    </div>
  </div>

  <!-- ¿A TI TAMBIÉN TE PASA? -->
  <section class="problems-section" id="problems">
    <div class="problems-section__container">
      <h2 class="problems-section__title" id="problemsTitle"></h2>
      <div class="problems-section__rows" id="problemsRows"></div>
    </div>
  </section>

  <!-- CTA FINAL -->
  <section class="final-cta-section" id="finalCta">
    <div class="final-cta-section__content">
      <span class="label" id="finalCtaLabel"></span>
      <h2 class="final-cta-section__title" id="finalCtaTitle"></h2>
      <p class="final-cta-section__text" id="finalCtaText"></p>
      <button class="btn btn--gold btn--large" id="ctaFinal" aria-label="Aplicar ahora">
        <span id="ctaFinalText"></span>
      </button>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer" id="footer">
    <div class="footer__container">
      <div class="footer__left">
        <p class="footer__brand" id="footerBrand"></p>
      </div>
      <div class="footer__right">
        <a href="#" id="privacyLink" class="footer__link">Política de privacidad</a>
        <a href="#" id="legalLink" class="footer__link">Aviso legal</a>
        <a href="#" id="contactLink" class="footer__link">Contacto</a>
      </div>
    </div>
  </footer>

  <!-- Barra CTA fija en móvil -->
  <div class="sticky-cta-mobile" id="stickyCta">
    <button class="btn btn--gold btn--full-width" id="ctaSticky" aria-label="Aplicar ahora">
      <span id="ctaStickyText"></span>
    </button>
  </div>

  <!-- Scripts -->
  <script src="./js/config.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/tracking.js"></script>

</body>
</html>
